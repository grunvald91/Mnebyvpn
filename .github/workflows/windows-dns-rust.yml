name: Windows DNS Rust UI check

on:
  push:
    branches: [feature/windows-dns-rust-tray]
    paths:
      - "apps/windows-dns/**"
      - ".github/workflows/windows-dns-rust.yml"
  pull_request:
    paths:
      - "apps/windows-dns/**"
      - ".github/workflows/windows-dns-rust.yml"
  workflow_dispatch:

concurrency:
  group: windows-dns-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check UI JavaScript and UI contract
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/windows-dns/ui/app.js
          node apps/windows-dns/ui/contract.test.mjs
      - name: Check Rust formatting (fail fast)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/windows-dns/dns-core/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/network/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/transaction/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/ipc/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/journal/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/service/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path apps/windows-dns/setup/Cargo.toml -- --check
      - name: DNS core unit tests (no remote traffic)
        run: cargo test --manifest-path apps/windows-dns/dns-core/Cargo.toml
      - name: Network inventory unit tests (no adapter changes)
        run: cargo test --manifest-path apps/windows-dns/network/Cargo.toml
      - name: Native Windows DNS preflight (no network changes)
        run: cargo run --manifest-path apps/windows-dns/network/Cargo.toml --example preflight_safety
      - name: DNS transaction and recovery unit tests (mock only)
        run: cargo test --manifest-path apps/windows-dns/transaction/Cargo.toml
      - name: File recovery journal and Windows ACL tests
        run: cargo test --manifest-path apps/windows-dns/journal/Cargo.toml
      - name: Read-only named pipe protocol unit tests
        run: cargo test --manifest-path apps/windows-dns/ipc/Cargo.toml
      - name: Native service setup read-only unit tests
        run: cargo test --manifest-path apps/windows-dns/setup/Cargo.toml
      - name: Compile Windows health service
        run: cargo check --manifest-path apps/windows-dns/service/Cargo.toml
      - name: Compile Windows adapter inventory
        run: cargo check --manifest-path apps/windows-dns/network/Cargo.toml
      - name: Compile Rust tray and diagnostics
        run: cargo check --manifest-path apps/windows-dns/src-tauri/Cargo.toml
      - name: Compile native Windows service installer
        run: cargo check --manifest-path apps/windows-dns/setup/Cargo.toml
      - name: Build release diagnostic service
        run: cargo build --release --manifest-path apps/windows-dns/service/Cargo.toml
      - name: Build release native setup executable
        run: cargo build --release --manifest-path apps/windows-dns/setup/Cargo.toml
      - name: Upload unsigned native service setup preview
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-win10-service-setup-unsigned
          path: |
            apps/windows-dns/service/target/release/mnebydns-health-service.exe
            apps/windows-dns/setup/target/release/mnebydns-setup.exe
            apps/windows-dns/setup/INSTALL-WINDOWS.md
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test read-only SCM and authenticated IPC on disposable runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-dns-rust-tray'
        shell: pwsh
        run: ./apps/windows-dns/setup/smoke-runner.ps1
      - name: Build standalone Windows GUI preview
        run: cargo build --release --manifest-path apps/windows-dns/src-tauri/Cargo.toml
      - name: Prepare portable GUI preview with checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'apps/windows-dns/portable-preview'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'apps/windows-dns/src-tauri/target/release/mnebydns-windows.exe' "$folder/mnebydns-windows.exe"
          Copy-Item 'apps/windows-dns/TRY-WINDOWS-10.md' "$folder/START-HERE.md"
          $hash = (Get-FileHash -Algorithm SHA256 "$folder/mnebydns-windows.exe").Hash.ToLowerInvariant()
          "$hash  mnebydns-windows.exe" | Out-File -LiteralPath "$folder/SHA256.txt" -Encoding ascii
      - name: Upload portable Windows GUI preview (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-win10-diagnostics-unsigned
          path: apps/windows-dns/portable-preview/*
          if-no-files-found: error
          retention-days: 14
