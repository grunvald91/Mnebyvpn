name: Windows DNS system client

on:
  push:
    branches: [feature/windows-dns-rust-tray]
    paths:
      - "apps/windows-dns/**"
      - ".github/workflows/windows-dns-rust.yml"
  pull_request:
    paths:
      - "apps/windows-dns/**"
      - ".github/workflows/windows-dns-rust.yml"
  workflow_dispatch:

concurrency:
  group: windows-dns-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check UI JavaScript and UI contract
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/windows-dns/ui/app.js
          node apps/windows-dns/ui/contract.test.mjs

      - name: Check Rust formatting (report all crates)
        shell: bash
        run: |
          set -euo pipefail
          broken=0
          for crate in dns-core network transaction ipc journal service src-tauri setup; do
            if ! cargo fmt --manifest-path "apps/windows-dns/$crate/Cargo.toml" -- --check; then
              broken=1
            fi
          done
          exit "$broken"

      - name: DNS core unit tests
        run: cargo test --manifest-path apps/windows-dns/dns-core/Cargo.toml

      - name: Network inventory and DNS mode unit tests
        run: cargo test --manifest-path apps/windows-dns/network/Cargo.toml

      - name: Native Windows DNS read-only preflight
        run: cargo run --manifest-path apps/windows-dns/network/Cargo.toml --example preflight_safety

      - name: Transaction state machine unit tests
        run: cargo test --manifest-path apps/windows-dns/transaction/Cargo.toml

      - name: Protected multi-adapter recovery journal tests
        run: cargo test --manifest-path apps/windows-dns/journal/Cargo.toml

      - name: Authenticated local IPC protocol tests
        run: cargo test --manifest-path apps/windows-dns/ipc/Cargo.toml

      - name: Windows service installer tests
        run: cargo test --manifest-path apps/windows-dns/setup/Cargo.toml

      - name: Test persistent DNS service emergency recovery and re-enable
        run: cargo test --manifest-path apps/windows-dns/service/Cargo.toml

      - name: Compile persistent Windows DNS service
        run: cargo check --manifest-path apps/windows-dns/service/Cargo.toml

      - name: Compile Windows adapter DNS backend
        run: cargo check --manifest-path apps/windows-dns/network/Cargo.toml

      - name: Compile Windows GUI and tray
        run: cargo check --manifest-path apps/windows-dns/src-tauri/Cargo.toml

      - name: Build release Windows DNS service
        run: cargo build --release --manifest-path apps/windows-dns/service/Cargo.toml

      - name: Build release setup helper
        run: cargo build --release --manifest-path apps/windows-dns/setup/Cargo.toml

      - name: Build release GUI
        run: cargo build --release --manifest-path apps/windows-dns/src-tauri/Cargo.toml

      - name: Smoke test automatic SCM service and authenticated IPC on disposable runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-dns-rust-tray'
        shell: pwsh
        run: ./apps/windows-dns/setup/smoke-runner.ps1

      # Run privileged mutation and exact rollback BEFORE shipping any artifact.
      # The disposable runner must restore DNS even when the apply check fails.
      - name: Native SetInterfaceDnsSettings apply and restore smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-dns-rust-tray'
        run: cargo run --release --manifest-path apps/windows-dns/network/Cargo.toml --example dns_mutation_smoke

      - name: Verify portable EXEs do not depend on VC++ redistributable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere unavailable' }
          $vsroot = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vsroot) { throw 'Visual Studio root unavailable' }
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vsroot 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match 'Hostx64[\\/]x64[\\/]dumpbin.exe$' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin unavailable' }
          $executables = @(
            'apps/windows-dns/src-tauri/target/release/mnebydns-windows.exe',
            'apps/windows-dns/setup/target/release/mnebydns-setup.exe',
            'apps/windows-dns/service/target/release/mnebydns-health-service.exe'
          )
          foreach ($exe in $executables) {
            $imports = (& $dumpbin.FullName /dependents $exe) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Dependency inspection failed: $exe" }
            if ($imports -match '(?im)^\s*(VCRUNTIME140(?:_1)?|MSVCP140|CONCRT140)\.dll\s*$') {
              throw "VC runtime DLL imported by $exe"
            }
            Write-Output "No VC++ runtime dependency: $exe"
          }

      - name: Prepare complete portable Windows client and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'apps/windows-dns/portable-preview'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'apps/windows-dns/src-tauri/target/release/mnebydns-windows.exe' "$folder/mnebydns-windows.exe"
          Copy-Item 'apps/windows-dns/setup/target/release/mnebydns-setup.exe' "$folder/mnebydns-setup.exe"
          Copy-Item 'apps/windows-dns/service/target/release/mnebydns-health-service.exe' "$folder/mnebydns-health-service.exe"
          Copy-Item 'apps/windows-dns/TRY-WINDOWS-10.md' "$folder/START-HERE.md"
          $names = @('mnebydns-windows.exe','mnebydns-setup.exe','mnebydns-health-service.exe')
          $hashLines = foreach ($name in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 "$folder/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashLines | Out-File -LiteralPath "$folder/SHA256.txt" -Encoding ascii

      - name: Upload complete Windows DNS client (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mnebydns-win10-system-dns-unsigned
          path: apps/windows-dns/portable-preview/*
          if-no-files-found: error
          retention-days: 14

