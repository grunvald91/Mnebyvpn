name: MNEBYVPN Telegram webhook digest and activation (token stays in GitHub)
on:
  push:
    paths: ['.github/workflows/telegram-webhook-setup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BOT || secrets.TELEGRAM_BOT_TOKEN }}
      ACTIVATE_WEBHOOK: 'yes'
    steps:
      - name: Check BotFather identity and print only SHA256 of webhook secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing Bot API token"; exit 2; }
          python3 - <<'PY'
          import os,hmac,hashlib,urllib.request,json,sys
          token=os.environ['TELEGRAM_BOT_TOKEN']
          secret=hmac.new(token.encode(),b'mnebyvpn.webhook.v1',hashlib.sha256).hexdigest()
          digest=hashlib.sha256(secret.encode()).hexdigest()
          print('TELEGRAM_WEBHOOK_SECRET_SHA256='+digest)
          def call(method,payload=None):
            body=json.dumps(payload or {}).encode()
            request=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
              method='POST',headers={'Content-Type':'application/json'},data=body)
            with urllib.request.urlopen(request,timeout=12) as response:
              return json.load(response)
          try:
            who=call('getMe')
            assert who.get('ok') and str((who.get('result') or {}).get('username','')).lower()=='mnebyvpn_bot'
            info=call('getWebhookInfo')
            current=(info.get('result') or {}).get('url') or ''
            if current and current not in ('https://mnebyvpn.site/webhooks/telegram','https://cdn.servgo.ru/mnebyvpn-telegram/webhook','https://cdn.servgo.ru:8443/mnebyvpn-telegram/webhook'):
              raise ValueError('Another Telegram webhook is already configured')
            print('telegram_bot_verified=true')
            print('webhook_currently_set='+str(bool(current)).lower())
            if os.environ['ACTIVATE_WEBHOOK']=='yes':
              # An independent relay checked TLS and HTTP 401, since GitHub
              # runner egress IPs are not reaching port 443 on this VPS.
              # Source: infra GitHub Actions run 42209151934. Telegram then
              # independently calls this URL using its own network.
              result=call('setWebhook',{
                'url':'https://cdn.servgo.ru:8443/mnebyvpn-telegram/webhook',
                'secret_token':secret,
                'allowed_updates':['message','callback_query','pre_checkout_query'],
                'max_connections':5,
                'drop_pending_updates':False,
              })
              if not result.get('ok') or result.get('result') is not True:
                raise ValueError('Telegram rejected setWebhook')
              checked=call('getWebhookInfo').get('result') or {}
              if checked.get('url')!='https://cdn.servgo.ru:8443/mnebyvpn-telegram/webhook':
                raise ValueError('Telegram did not persist the intended webhook')
              print('telegram_webhook_activated=true')
              print('telegram_webhook_url_verified=true')
              print('telegram_webhook_using_foreign_8443=true')
              print('telegram_pending_after_activation='+str(checked.get('pending_update_count','unknown')))
            else:
              # Telegram updates must reach a verified foreign server.
              # Disable only our old Russian-host webhook, preserving pending updates.
              if current=='https://mnebyvpn.site/webhooks/telegram':
                result=call('deleteWebhook',{'drop_pending_updates':False})
                if not result.get('ok') or result.get('result') is not True:
                  raise ValueError('Could not stop old RU webhook')
                print('previous_russian_host_webhook_disabled=true')
              print('telegram_webhook_activated=false')
          except Exception:
            print('Telegram webhook identity/activation validation failed; no token printed')
            sys.exit(1)
          PY
