name: MNEBYVPN index-only Google URL Inspection audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gsc-public-index-audit.yml'
      - 'scripts/gsc-index-audit.ts'
      - 'scripts/gsc-sitemap-audit.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Public URL index-only inspection (no keyword or traffic exports)
        shell: bash
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:mnebyvpn.site' }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/gsc-index-audit.ts
      - name: Inspect whether public sitemap is registered and processed by Google
        shell: bash
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:mnebyvpn.site' }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/gsc-sitemap-audit.ts
