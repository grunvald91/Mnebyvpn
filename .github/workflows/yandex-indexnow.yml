name: MNEBYVPN notify Yandex IndexNow (public SEO changes only)
on:
  # Run a read-only production preflight for branch changes; submit only from
  # the merged main workflow. Do not repeatedly submit unchanged URLs daily.
  push:
    paths:
      - '.github/workflows/yandex-indexnow.yml'
      - 'scripts/yandex-indexnow.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnebyvpn-indexnow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prove IndexNow sends only approved public canonical pages
        run: node --experimental-strip-types --test tests/yandex-indexnow.test.ts tests/seo-core.test.ts
      - name: Read-only production preflight for key and all eight public pages
        run: node --experimental-strip-types scripts/yandex-indexnow.ts --preflight
      - name: Notify Yandex only after verified main release
        if: github.ref == 'refs/heads/main'
        run: node --experimental-strip-types scripts/yandex-indexnow.ts
