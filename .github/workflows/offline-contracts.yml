name: Offline code and database contracts

on:
  # Run once on each PR and once after merging into main.
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'ops/**'
      - '.github/workflows/deploy-production.yml'
      - 'packages/**'
      - 'tests/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/offline-contracts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'ops/**'
      - '.github/workflows/deploy-production.yml'
      - 'packages/**'
      - 'tests/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/offline-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js and disposable PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mnebyvpn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mnebyvpn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install test-only dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check TypeScript and unit contracts
        run: |
          npm run typecheck
          npm test
      - name: Validate unprivileged deployment shell
        run: bash -n ops/deploy-user-release.sh
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
      - name: Run schema and SQL contract tests (rollback fixtures)
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_initial.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_billing_and_reconcile.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0003_permanent_ipv6_claims.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0004_catalog_and_orders.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0005_outbox_retries.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0006_referral_invites.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0007_trials_and_throttle.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0008_pricing_drafts.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0009_trial_activation_on_provision.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0010_late_payment_capture.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0011_telegram_invoice_dispatch.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0012_website_renewals.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0013_entitlement_credits.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0014_website_sessions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0015_dns_credit_metering.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0016_vpn_subscription_links.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0017_web_guest_trials.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0018_website_support_tickets.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0019_vpn_1device_owner_prices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0020_vpn_stars_prices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0021_vpn_expiry_reminders.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0022_vpn_stars_owner_update.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0100_site_provider_identities.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0101_email_otp_and_trial_devices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0102_trial_paid_renewal.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0103_website_subscription_permissions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0104_purchase_notifications.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0105_paid_vpn_activation_clock.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0106_telegram_trial_auto_ready.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0107_website_referral_permissions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0108_dns_admin_domains.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0109_dns_admin_route_approval.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0111_dns_mtproxy_bonus_credentials.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0120_personal_dot_query_quota.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0121_personal_dns_stars_200_draft.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0002_billing_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0003_ipv6_claims_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0005_outbox_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0007_trials_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0008_pricing_drafts_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0009_trial_activation_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0011_invoice_dispatch_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0018_site_auth_trials_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0019_email_device_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0108_dns_admin_domains_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0109_dns_admin_route_approval_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0120_personal_dot_query_quota_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0121_personal_dns_stars_200_contract.sql
          # E2E test fixture explicitly simulates a separately deployed, verified node worker.
          psql -v ON_ERROR_STOP=1 -c "UPDATE vpn_release_flags SET enabled=true WHERE feature='paid_vpn_clock_on_node'" >/dev/null
      - name: Payment integration with disposable PostgreSQL
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: npm run test:integration
      # The SAME runtime dependencies that passed CI are shipped to the VPS.
      # Remote npm install after tests would resolve a different dependency graph.
      - name: Pack tested runtime without dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/pg/package.json
          mkdir -p release
          tar -czf release/release.tgz apps packages package.json node_modules
          (cd release && sha256sum release.tgz > release.tgz.sha256)
          printf '%s\n' "$GITHUB_SHA" > release/commit.sha
      - name: Publish tested runtime for gated deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mnebyvpn-tested-runtime
          path: release/
          retention-days: 2
          if-no-files-found: error
