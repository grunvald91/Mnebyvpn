name: Offline code and database contracts

on:
  # Run once on each PR and once after merging into main.
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'ops/**'
      - '.github/workflows/deploy-production.yml'
      - 'packages/**'
      - 'tests/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/offline-contracts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'ops/**'
      - '.github/workflows/deploy-production.yml'
      - 'packages/**'
      - 'tests/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/offline-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js and disposable PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mnebyvpn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mnebyvpn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install test-only dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check TypeScript and unit contracts
        run: |
          npm run typecheck
          npm test
      - name: Validate unprivileged deployment shell
        run: bash -n ops/deploy-user-release.sh
      - name: Validate RU188 isolated Docker image and offline canary contract
        run: |
          set -euo pipefail
          bash -n ops/controller188-runtime/stage.sh
          node --test tests/controller188-runtime.test.mjs
      - name: Verify on-device X25519 and private-key-free FI browser registration
        run: |
          set -Eeuo pipefail
          node --check apps/web/public/awg-setup.js
          node --test tests/awg-browser-setup.test.mjs
      - name: Test isolated controller key bootstrap as root on disposable CI runner
        run: |
          set -euo pipefail
          # Only disposable test identities. Never provision production material in Actions.
          sudo "$(command -v node)" --experimental-strip-types --test tests/trusted-controller-bootstrap.test.mjs
      - name: Validate controller188 native systemd staging and inactive production gates
        run: |
          set -euo pipefail
          python3 -m py_compile ops/controller188-systemd/install-runtime.py ops/controller188-systemd/build-bundle.py tests/test_controller188_host_systemd.py
          bash -n ops/controller188-systemd/ship.sh
          # Failure-injection exercises must run with disposable root-owned /run and /root fixtures.
          sudo python3 -m unittest discover -s tests -p 'test_controller188_host_systemd.py' -v
          node --check ops/controller188-systemd/runtime-smoke.mjs
      - name: Validate operator-gated FI public-key trust stage with disposable root fixtures
        run: |
          set -euo pipefail
          python3 -m py_compile ops/controller188-systemd/stage-fi-public-trust.py tests/test_fi_public_trust_stage.py
          sudo python3 -m unittest discover -s tests -p 'test_fi_public_trust_stage.py' -v
      - name: Test Python/OpenSSL bootstrap for existing RU188 (disposable runner only)
        run: |
          set -euo pipefail
          python3 -m py_compile ops/controller188-key-bootstrap.py tests/test_controller188_key_bootstrap.py
          sudo python3 -m unittest discover -s tests -p 'test_controller188_key_bootstrap.py' -v
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
      - name: Run schema and SQL contract tests (rollback fixtures)
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_initial.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_billing_and_reconcile.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0003_permanent_ipv6_claims.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0004_catalog_and_orders.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0005_outbox_retries.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0006_referral_invites.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0007_trials_and_throttle.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0008_pricing_drafts.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0009_trial_activation_on_provision.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0010_late_payment_capture.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0011_telegram_invoice_dispatch.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0012_website_renewals.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0013_entitlement_credits.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0014_website_sessions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0015_dns_credit_metering.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0016_vpn_subscription_links.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0017_web_guest_trials.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0018_website_support_tickets.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0019_vpn_1device_owner_prices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0020_vpn_stars_prices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0021_vpn_expiry_reminders.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0022_vpn_stars_owner_update.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0100_site_provider_identities.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0101_email_otp_and_trial_devices.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0102_trial_paid_renewal.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0103_website_subscription_permissions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0104_purchase_notifications.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0105_paid_vpn_activation_clock.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0106_telegram_trial_auto_ready.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0107_website_referral_permissions.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0108_dns_admin_domains.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0109_dns_admin_route_approval.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0111_dns_mtproxy_bonus_credentials.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0120_personal_dot_query_quota.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0121_personal_dns_stars_200_draft.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0122_personal_dns_native_query_billing.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0123_yookassa_review_login.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0124_smart_dns_four_stars_offers.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0125_website_personal_dns_apple.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0126_owner_dns_links.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0127_vpn_additional_nodes.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0128_vpn_node_enrollment.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0129_node_enrollment_guard.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0130_owner_dns_video_routes.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0131_vpn_awg_peer_allocations.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0132_yookassa_and_3in1_catalog.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0133_vpn_awg_command_outbox.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0134_stars_ratio_and_3in1_bot.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0135_awg_worker_row_lock_gateway.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0136_awg_device_enrollment_queue.sql >/dev/null
          # Exact FI217 subscriber backfill privilege and trigger contract.
          # Disposable CI role only; not a production credential.
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE mnebyvpn_awg_delivery NOLOGIN NOINHERIT" >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0137_awg_controller_subscription_enrollment.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0138_awg_worker_provisioning_read.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0139_awg_peer_address_trigger_owner.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0140_trial_smart_dns_delivery.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0141_owner_manual_sales.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0142_owner_vpn_three_device_seats.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0147_vpn_shared_connection_leases.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0148_vpn_shared_verified_node_admission.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0002_billing_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0003_ipv6_claims_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0005_outbox_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0007_trials_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0008_pricing_drafts_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0009_trial_activation_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0011_invoice_dispatch_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0018_site_auth_trials_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0019_email_device_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0108_dns_admin_domains_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0109_dns_admin_route_approval_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0120_personal_dot_query_quota_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0121_personal_dns_stars_200_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0122_native_stars_dns_settlement_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0124_smart_dns_four_stars_offers_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0125_website_personal_dns_apple_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0126_owner_dns_links_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0127_vpn_additional_nodes_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0128_vpn_node_enrollment_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0129_node_enrollment_guard_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0130_owner_dns_video_routes_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0132_yookassa_and_3in1_catalog_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0133_awg_command_outbox_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0134_stars_ratio_and_3in1_bot_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0140_trial_smart_dns_delivery_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0147_vpn_shared_connection_leases_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/0148_vpn_shared_verified_node_admission_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0149_vpn_shared_node_identity_pin_guard.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0149_vpn_shared_node_identity_pin_guard_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0150_fi_regional_dns_query_meter.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0150_fi_regional_dns_query_meter_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0151_fi_dns_meter_verified_rpc.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0151_fi_dns_meter_verified_rpc_contract.sql
          # E2E test fixture explicitly simulates a separately deployed, verified node worker.
          psql -v ON_ERROR_STOP=1 -c "UPDATE vpn_release_flags SET enabled=true WHERE feature='paid_vpn_clock_on_node'" >/dev/null
      - name: Concurrent cross-country VPN admission (disposable PostgreSQL only)
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          test "$PGDATABASE" = mnebyvpn_test
          node --experimental-strip-types --test tests/ci/shared-vpn-connections-pg.test.ts
          node --experimental-strip-types --test tests/ci/fi-dns-meter-pg.test.ts
          node --experimental-strip-types --test tests/ci/fi-dns-meter-rpc-pg.test.ts
      - name: Verify paid FI signed snapshot publication (disposable PostgreSQL)
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          test "$PGDATABASE" = mnebyvpn_test
          psql -v ON_ERROR_STOP=1 -f db/migrations/0152_fi_dns_snapshot_source.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0153_website_vpn_trial_recovery.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0154_website_trial_recovery_invites.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0155_legacy_email_trial_backfill.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0156_regional_dns_credential_issuer.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0157_regional_dns_telegram_access.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/migrations/0158_website_regional_dns_access.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0158_website_regional_dns_access_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0159_fi_dns_trial_eligibility.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0159_fi_dns_trial_eligibility_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0160_bundle_trial_shared_vpn_capacity.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -f db/tests/0160_bundle_trial_shared_vpn_capacity_contract.sql
          node --check apps/web/public/app.js
          node --experimental-strip-types --test tests/ci/fi-dns-snapshot-publisher-pg.test.ts
      - name: Checkout exact reviewed FI node code for cross-repository E2E
        uses: actions/checkout@v4
        with:
          repository: grunvald91/telegram-proxy-infra
          ref: 6e8a721f03e9ab267227f6d0d69094f27c1f14fc
          path: fi-node-fixture
          persist-credentials: false
      - name: Exercise FI DoT TLS through signed controller and real PostgreSQL
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          test "$PGDATABASE" = mnebyvpn_test
          python3 -B fi-node-fixture/nodekit/fi_dns_pilot_build.py fi-node-fixture/nodekit "$RUNNER_TEMP/fi-node-pilot"
          export PYTHONPATH="$RUNNER_TEMP/fi-node-pilot:${GITHUB_WORKSPACE}/fi-node-fixture/nodekit"
          node --experimental-strip-types --test tests/ci/fi-dns-cross-repo-pg.test.ts
      - name: Payment integration with disposable PostgreSQL
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: npm run test:integration
      - name: Verify native AWG subscription SQL using exact SELECT-only PostgreSQL role
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          node --experimental-strip-types --test tests/ci/awg-material-readonly-pg.test.ts
      - name: Exercise FI217 session-gated public-key registration in disposable PostgreSQL
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          node --experimental-strip-types --test tests/ci/awg-device-registration-pg.test.ts
      - name: Verify FI217 signed worker trigger has scoped definer pool lock
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -Eeuo pipefail
          node --experimental-strip-types --test tests/ci/awg-peer-trigger-owner-pg.test.ts
      - name: Prove signed AWG grant ACK and guarded revoke in disposable PostgreSQL
        env:
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test
          PGDATABASE: mnebyvpn_test
        run: |
          set -euo pipefail
          # Separate explicitly disposable DB and ephemeral keys. The test SSH
          # runner is injected: it MUST NEVER contact real FI217/RU188 hosts.
          test "$PGDATABASE" = mnebyvpn_test
          sudo "$(command -v node)" --experimental-strip-types --test \
            tests/ci/awg-delivery-disposable-e2e.test.ts
      # The SAME runtime dependencies that passed CI are shipped to the VPS.
      # Remote npm install after tests would resolve a different dependency graph.
      - name: Pack tested runtime without dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/pg/package.json
          mkdir -p release
          tar -czf release/release.tgz apps packages package.json node_modules
          (cd release && sha256sum release.tgz > release.tgz.sha256)
          printf '%s\n' "$GITHUB_SHA" > release/commit.sha
      - name: Publish tested runtime for gated deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mnebyvpn-tested-runtime
          path: release/
          retention-days: 2
          if-no-files-found: error
