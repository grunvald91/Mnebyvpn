name: MNEBYVPN production preflight (read-only)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_ENABLED: ${{ vars.MNEBYVPN_DEPLOY_ENABLED }}
      SSH_HOST: ${{ secrets.MNEBYVPN_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.MNEBYVPN_DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.MNEBYVPN_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.MNEBYVPN_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.MNEBYVPN_DEPLOY_SSH_PORT }}
    steps:
      - name: Check production prerequisites without exposing any secret
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ "$DEPLOY_ENABLED" == "true" ]]; then
            echo 'deploy_enabled=true'
          else
            echo 'deploy_enabled=false (repository Actions variable MNEBYVPN_DEPLOY_ENABLED must be true)'
            missing=1
          fi
          for field in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -n "${!field}" ]]; then
              echo "$field=configured"
            else
              echo "$field=missing"
              missing=1
            fi
          done
          if (( missing != 0 )); then
            echo "::warning::Production SSH access not configured; no connection attempted"
            exit 1
          fi
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9._-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port>0 && port<65536 ))
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$temp/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$temp/known_hosts"
          chmod 600 "$temp/id" "$temp/known_hosts"
          ssh -T -p "$port" -i "$temp/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$temp/known_hosts" \
            -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          for item in releases runtime-bot.env runtime-vpn.env; do
            path="$HOME/mnebyvpn/$item"
            if [[ "$item" == releases ]]; then
              [[ -d "$path" ]] && result=ready || result=missing
            else
              [[ -f "$path" ]] && result=ready || result=missing
            fi
            printf 'runtime_%s=%s\n' "$item" "$result"
          done
          if command -v node >/dev/null 2>&1; then
            printf 'node_version_check='
            if node -e 'const v=process.versions.node.split(".").map(Number);process.exit(v[0]>22||v[0]===22&&v[1]>=16?0:1)'; then
              echo ready
            else
              echo outdated
            fi
          else
            echo 'node_version_check=missing'
          fi
          for unit in mnebyvpn-telegram.service mnebyvpn-vpn-worker.service; do
            if systemctl --user cat "$unit" >/dev/null 2>&1; then
              echo "$unit=configured"
            else
              echo "$unit=missing"
            fi
          done
          REMOTE
