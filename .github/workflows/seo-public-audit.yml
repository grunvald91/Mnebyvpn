name: MNEBYVPN SEO public crawler audit
on:
  push:
    paths:
      - '.github/workflows/seo-public-audit.yml'
      - 'scripts/seo_public_audit_20261113.py'
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * *'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check syntax and audit live public indexability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/seo_public_audit_20261113.py
          python3 -u scripts/seo_public_audit_20261113.py
