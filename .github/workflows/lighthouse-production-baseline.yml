name: MNEBYVPN Lighthouse production performance baseline

on:
  push:
    paths:
      - '.github/workflows/lighthouse-production-baseline.yml'
      - 'scripts/lighthouse_baseline_summary.mjs'
  workflow_dispatch:
  schedule:
    - cron: '42 4 * * 1'

permissions:
  contents: read

jobs:
  production-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate report script and public HTTPS reachability
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lighthouse_baseline_summary.mjs
          mkdir -p "$RUNNER_TEMP/mnebyvpn-lighthouse"
          # Fail as a network check, not as a misleading performance score.
          # GET is intentional: the public website does not accept HEAD for /.
          ok=no
          for attempt in 1 2; do
            code="$(curl --noproxy '*' -sS --connect-timeout 8 --max-time 20 \
              -o /dev/null -w '%{http_code}' https://mnebyvpn.site/ || true)"
            echo "LIGHTHOUSE_PUBLIC_HTTPS_ATTEMPT_${attempt}=${code:-transport_error}"
            if [[ "$code" == 200 ]]; then ok=yes;break;fi
            sleep 2
          done
          if [[ "$ok" != yes ]]; then
            echo 'LIGHTHOUSE_NETWORK_UNAVAILABLE=true'
            exit 2
          fi
      - name: Verify compressed public CSS/JS and representation-specific ETags
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for file in site.css neo.css journey.css app.js journey.js; do
            url="https://mnebyvpn.site/$file"
            curl --noproxy '*' -fsS --connect-timeout 8 --max-time 25 \
              -H 'Accept-Encoding: identity' -D "$scratch/plain.headers" \
              -o "$scratch/plain" "$url"
            curl --noproxy '*' -fsS --connect-timeout 8 --max-time 25 \
              -H 'Accept-Encoding: br' -D "$scratch/encoded.headers" \
              -o "$scratch/encoded" "$url"
            codec="$(awk 'tolower($1)=="content-encoding:" {gsub(/\r/,"",$2); print tolower($2)}' "$scratch/encoded.headers" | tail -n1)"
            etag="$(awk 'tolower($1)=="etag:" {gsub(/\r/,"",$2); print $2}' "$scratch/encoded.headers" | tail -n1)"
            vary="$(awk 'tolower($1)=="vary:" {gsub(/\r/,""); print tolower($0)}' "$scratch/encoded.headers" | tail -n1)"
            [[ "$codec" == br ]] || { echo "PUBLIC_STATIC_ENCODING_FAIL=$file codec=${codec:-none}"; exit 2; }
            [[ "$vary" == *accept-encoding* ]] || { echo "PUBLIC_STATIC_VARY_FAIL=$file"; exit 2; }
            [[ -n "$etag" ]] || { echo "PUBLIC_STATIC_ETAG_MISSING=$file"; exit 2; }
            node -e 'const fs=require("node:fs"),z=require("node:zlib");const [raw,packed]=process.argv.slice(1).map(x=>fs.readFileSync(x));if(!z.brotliDecompressSync(packed).equals(raw))process.exit(2)' \
              "$scratch/plain" "$scratch/encoded"
            code="$(curl --noproxy '*' -sS --connect-timeout 8 --max-time 25 \
              -H 'Accept-Encoding: br' -H "If-None-Match: $etag" \
              -o /dev/null -w '%{http_code}' "$url")"
            [[ "$code" == 304 ]] || { echo "PUBLIC_STATIC_NOT_MODIFIED_FAIL=$file status=$code";exit 2; }
            echo "PUBLIC_STATIC_OK=$file compression=br etag_304=yes"
          done
      - name: Install pinned official Lighthouse CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mnebyvpn-lighthouse-tools" --no-save lighthouse@13.6.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo 'CHROME_BINARY_UNAVAILABLE=true'
            exit 2
          fi
      - name: Audit production homepage on mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          target='https://mnebyvpn.site/'
          for device in mobile desktop; do
            flags=()
            if [[ "$device" == desktop ]]; then flags+=(--preset=desktop); fi
            for sample in 1 2 3; do
              success=no
              for attempt in 1 2; do
                echo "LIGHTHOUSE_RUN_START device=$device sample=$sample attempt=$attempt"
                if timeout 210s "$RUNNER_TEMP/mnebyvpn-lighthouse-tools/node_modules/.bin/lighthouse" "$target" \
                  --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                  --only-categories=performance,seo \
                  --output=json --quiet \
                  --output-path="$RUNNER_TEMP/mnebyvpn-lighthouse/$device-$sample.json" "${flags[@]}"; then
                  success=yes
                  break
                fi
                echo "LIGHTHOUSE_ATTEMPT_FAILED device=$device sample=$sample attempt=$attempt"
                sleep 2
              done
              [[ "$success" == yes ]] || { echo "LIGHTHOUSE_AUDIT_FAILED device=$device sample=$sample";exit 2; }
            done
          done
          node scripts/lighthouse_baseline_summary.mjs "$RUNNER_TEMP/mnebyvpn-lighthouse"
      - name: Preserve baseline reports for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnebyvpn-production-lighthouse-mobile-desktop
          path: |
            ${{ runner.temp }}/mnebyvpn-lighthouse/mobile-*.json
            ${{ runner.temp }}/mnebyvpn-lighthouse/desktop-*.json
            ${{ runner.temp }}/mnebyvpn-lighthouse/summary.json
            ${{ runner.temp }}/mnebyvpn-lighthouse/summary.md
          if-no-files-found: warn
          retention-days: 14
