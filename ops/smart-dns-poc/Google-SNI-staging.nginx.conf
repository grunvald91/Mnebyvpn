# MNEBYDNS foreign-only HTTPS passthrough proof of concept.
# Must be rendered into a private temp directory and run independently of live nginx.
# No DNS rewrites, no publicly exposed ports, no paid subscriber connections.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid /tmp/mnebydns-ci-GH_RUN_ID/google-sni.pid;
error_log /tmp/mnebydns-ci-GH_RUN_ID/google-sni.log warn;
events { worker_connections 80; }

stream {
    resolver 9.9.9.9 ipv6=off valid=30s;
    resolver_timeout 3s;
    map $ssl_preread_server_name $mnebydns_origin {
        default 127.0.0.1:1;
        gemini.google.com gemini.google.com:443;
        aistudio.google.com aistudio.google.com:443;
        accounts.google.com accounts.google.com:443;
        generativelanguage.googleapis.com generativelanguage.googleapis.com:443;
        labs.google labs.google:443;
        www.google.com www.google.com:443;
        www.youtube.com www.youtube.com:443;
        www.gstatic.com www.gstatic.com:443;
    }
    server {
        listen 127.0.0.1:15443;
        ssl_preread on;
        proxy_pass $mnebydns_origin;
        proxy_connect_timeout 4s;
        proxy_timeout 25s;
        proxy_buffer_size 16k;
        access_log off;
    }
}
