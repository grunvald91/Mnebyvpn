# MNEBYDNS single-host Gemini HTTPS passthrough. Loopback ONLY.
# Other hostnames are denied locally. The existing public 443 dispatcher
# remains authoritative and needs a SEPARATE reviewed single-entry change.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid /run/mnebydns-gemini/nginx.pid;
error_log stderr warn;
events { worker_connections 80; }
stream {
    resolver 9.9.9.9 ipv6=off valid=30s;
    resolver_timeout 3s;
    map $ssl_preread_server_name $mnebydns_gemini_origin {
        default 127.0.0.1:1;
        gemini.google.com gemini.google.com:443;
    }
    server {
        listen 127.0.0.1:15443;
        ssl_preread on;
        proxy_pass $mnebydns_gemini_origin;
        proxy_connect_timeout 4s;
        proxy_timeout 60s;
        proxy_buffer_size 16k;
        access_log off;
    }
}
