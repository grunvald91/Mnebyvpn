# Gemini auxiliary HTTPS passthrough. Exact official Gemini hosts only.
# Separate from existing Gemini 15443; no public listener on 443 here.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid /run/mnebydns-gemini-aux/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
stream {
    resolver 9.9.9.9 ipv6=off valid=30s;
    resolver_timeout 3s;
    map $ssl_preread_server_name $gemini_aux_target {
        default 127.0.0.1:1;
        jnn-pa.googleapis.com jnn-pa.googleapis.com:443;
        waa-pa.clients6.google.com waa-pa.clients6.google.com:443;
    }
    server {
        listen 127.0.0.1:15444;
        ssl_preread on;
        proxy_pass $gemini_aux_target;
        proxy_connect_timeout 4s;
        proxy_timeout 60s;
        proxy_buffer_size 16k;
        access_log off;
    }
}
