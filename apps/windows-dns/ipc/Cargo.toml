[package]
name = "mnebydns-ipc"
version = "0.7.0"
edition = "2021"
description = "Read-only Windows named pipe transport for mnebyDNS service health"

[dependencies]
mnebydns-core = { path = "../dns-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
