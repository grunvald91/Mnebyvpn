[package]
name = "mnebydns-windows"
version = "0.14.0"
description = "Lightweight Windows Smart DNS client with one-button controller and tray"
authors = ["mnebyDNS"]
edition = "2021"
build = "build.rs"

[lib]
name = "mnebydns_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
mnebydns-core = { path = "../dns-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mnebydns-network = { path = "../network" }
mnebydns-ipc = { path = "../ipc" }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Services", "Win32_System_Threading"] }
