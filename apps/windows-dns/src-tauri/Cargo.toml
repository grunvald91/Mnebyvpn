[package]
name = "mnebydns-windows"
version = "0.8.0"
description = "Lightweight Windows GUI and tray with read-only DNS and adapter diagnostics"
authors = ["mnebyDNS"]
edition = "2021"
build = "build.rs"

[lib]
name = "mnebydns_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
mnebydns-core = { path = "../dns-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mnebydns-network = { path = "../network" }
mnebydns-ipc = { path = "../ipc" }
