[package]
name = "mnebydns-journal"
version = "0.6.0"
edition = "2021"
description = "Fail-closed persistent recovery journal for Windows DNS controller"

[dependencies]
mnebydns-transaction = { path = "../transaction" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
